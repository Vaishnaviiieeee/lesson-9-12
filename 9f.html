<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9f</title>
    <style>
        .friend-card {
            width: 180px;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .friend-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }
        .friend-card .info {
            padding: 10px;
        }
        .friend-card .name {
            font-weight: bold;
            margin: 0 0 4px 0;
        }
        .friend-card .mutual {
            font-size: 12px;
            color: #777;
            margin: 0 0 8px 0;
        }
        .friend-card button {
            width: 100%;
            padding: 8px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="friend-card">
        <img src="https://placecats.com/300/200" alt="Oliver">
        <div class="info">
            <p class="name">Oliver</p>
            <p class="mutual">2 mutual friends</p>
            <button>Add Friend</button>
        </div>
    </div>
</body>
</html>
