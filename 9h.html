<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9h</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .line {
            text-align: center;
        }
        img {
            width: 272px;
            margin-top: 60px;
        }
        input[type="text"] {
            width: 400px;
            max-width: 90%;
            padding: 12px 20px;
            border: none;
            border-radius: 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.2);
            font-size: 14px;
            margin-top: 20px;
        }
        button {
            padding: 10px 16px;
            margin-top: 20px;
            margin-left: 4px;
            margin-right: 4px;
            border: 1px solid #f2f2f2;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-size: 13px;
            color: #3c4043;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="line">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google logo">
    </div>
    <div class="line">
        <input type="text" placeholder="Search Google or type a URL">
    </div>
    <div class="line">
        <button>Google Search</button>
        <button>I'm Feeling Lucky</button>
    </div>
</body>
</html>
