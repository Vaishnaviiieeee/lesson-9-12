<!DOCTYPE html>
<html>
<head>
    <title>Exercise 11d</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 8px;
            align-items: center;
        }
        .friend-card {
            width: 160px;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .friend-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }
        .friend-card .info {
            padding: 10px;
        }
        .friend-card .name {
            font-weight: bold;
            margin: 4px;
        }
        .friend-card .mutual {
            font-size: 12px;
            color: #777;
            margin: 4px;
        }
        .friend-card button {
            width: 100%;
            padding: 8px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="friend-card">
            <img src="https://placecats.com/300/200?image=1" alt="Oliver">
            <div class="info">
                <p class="name">Oliver</p>
                <p class="mutual">2 mutual friends</p>
                <button>Add Friend</button>
            </div>
        </div>
        <div class="friend-card">
            <img src="https://placecats.com/300/200?image=2" alt="Mimi">
            <div class="info">
                <p class="name">Mimi</p>
                <p class="mutual">3 mutual friends</p>
                <button>Add Friend</button>
            </div>
        </div>
        <div class="friend-card">
            <img src="https://placecats.com/300/200?image=3" alt="Rex">
            <div class="info">
                <p class="name">Rex</p>
                <p class="mutual">4 mutual friends</p>
                <button>Add Friend</button>
            </div>
        </div>
    </div>
</body>
</html>
