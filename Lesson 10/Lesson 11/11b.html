<!DOCTYPE html>
<html>
<head>
    <title>Exercise 11b</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 50px 1fr 75px;
        }
        .grid div {
            background-color: #f4a6a6;
            padding: 15px;
        }
        .grid div:nth-child(3) {
            background-color: #a8dadc;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div>col1</div>
        <div>col2</div>
        <div>col3</div>
    </div>
</body>
</html>
