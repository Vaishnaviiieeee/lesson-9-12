<!DOCTYPE html>
<html>
<head>
    <title>Exercise 12e</title>
    <style>
        .menu {
            width: 220px;
            border: 1px solid #ddd;
            font-family: Arial, sans-serif;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        .badge {
            background-color: #1877f2;
            color: white;
            font-size: 12px;
            font-weight: bold;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="menu">
        <div class="menu-item">
            <span>Home</span>
            <span class="badge">14</span>
        </div>
        <div class="menu-item">
            <span>Notifications</span>
            <span class="badge">3</span>
        </div>
        <div class="menu-item">
            <span>Messages</span>
            <span class="badge">5</span>
        </div>
    </div>
</body>
</html>
