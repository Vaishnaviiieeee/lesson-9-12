<!DOCTYPE html>
<html>
<head>
    <title>Exercise 12f</title>
    <style>
        .bar {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #7b4fc1;
            padding: 10px 15px;
            font-family: Arial, sans-serif;
        }
        .home {
            color: white;
            font-weight: bold;
        }
        .search {
            flex: 1;
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
        }
        .download {
            padding: 8px 16px;
            background-color: #5a3a99;
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="bar">
        <span class="home">Home</span>
        <input class="search" type="text" placeholder="Search">
        <button class="download">Download</button>
    </div>
</body>
</html>
