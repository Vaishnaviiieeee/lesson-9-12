<!DOCTYPE html>
<html>
<head>
    <title>Exercise 12b</title>
    <style>
        .flex {
            display: flex;
        }
        .flex div {
            padding: 15px;
            background-color: #f4a6a6;
        }
        .flex div:nth-child(1) {
            width: 50px;
        }
        .flex div:nth-child(2) {
            flex: 1;
        }
        .flex div:nth-child(3) {
            width: 75px;
            background-color: #a8dadc;
        }
    </style>
</head>
<body>
    <div class="flex">
        <div>item1</div>
        <div>item2</div>
        <div>item3</div>
    </div>
</body>
</html>
