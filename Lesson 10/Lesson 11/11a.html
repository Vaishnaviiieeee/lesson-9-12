<!DOCTYPE html>
<html>
<head>
    <title>Exercise 11a</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 200px 75px;
        }
        .grid div:nth-child(1) {
            background-color: #a8dadc;
            padding: 15px;
        }
        .grid div:nth-child(2) {
            background-color: #f4a6a6;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div>200px</div>
        <div>75px</div>
    </div>
</body>
</html>
