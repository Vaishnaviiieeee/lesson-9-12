<!DOCTYPE html>
<html>
<head>
    <title>Exercise 11c</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            column-gap: 20px;
            row-gap: 10px;
        }
        .grid div {
            background-color: #f4a6a6;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div>col1</div>
        <div>col2</div>
        <div>col3</div>
        <div>col4</div>
        <div>col1</div>
        <div>col2</div>
        <div>col3</div>
        <div>col4</div>
    </div>
</body>
</html>
