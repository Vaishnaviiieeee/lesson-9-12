<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9c</title>
    <style>
        .survey {
            width: 300px;
            padding: 15px;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif;
        }
        .survey p {
            margin: 0 0 10px 0;
        }
        .survey button {
            padding: 6px 14px;
            margin-right: 6px;
            border: 1px solid #999;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="survey">
        <p>Satisfied with our service?</p>
        <button>Yes</button>
        <button>No</button>
    </div>
</body>
</html>
