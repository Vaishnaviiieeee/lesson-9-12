<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9e</title>
    <style>
        .tweetbox {
            width: 400px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
        }
        .tweetbox img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }
        .tweetbox span {
            flex: 1;
            color: #657786;
        }
        .tweetbox button {
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="tweetbox">
        <img src="https://placecats.com/50/50" alt="avatar">
        <span>What's happening?</span>
        <button>Tweet</button>
    </div>
</body>
</html>
